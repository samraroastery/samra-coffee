<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سمراء | SAMRA Coffee</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --espresso:#211813;
 --cream:#f7f1e8;
 --sand:#dfcdb5;
 --copper:#b87333;
 --muted:#76695d;
}
*{box-sizing:border-box}
body{
 margin:0;
 background:var(--cream);
 color:var(--espresso);
 font-family:'Noto Kufi Arabic',sans-serif;
 padding:30px 16px;
}
.container{max-width:460px;margin:auto;display:flex;flex-direction:column;gap:18px}
.card{
 background:#fff;
 border:1px solid #eadfd1;
 border-radius:24px;
 padding:28px 22px;
 box-shadow:0 12px 35px rgba(33,24,19,.06);
}
.logo{
 width:90px;height:90px;margin:auto;
 border:1px solid var(--copper);
 border-radius:50%;
 display:flex;align-items:center;justify-content:center;
 font-family:'Cormorant Garamond',serif;
 font-size:55px;
 color:var(--copper);
}
h1{
 text-align:center;
 font-size:2rem;
 margin:15px 0 0;
}
.brand{
 text-align:center;
 font-family:'Cormorant Garamond',serif;
 letter-spacing:5px;
 font-size:1.4rem;
 margin:5px 0;
}
.tag{
 text-align:center;color:var(--muted);font-size:.85rem
}
.btn{
 display:block;text-align:center;text-decoration:none;
 padding:15px;border-radius:14px;margin-top:10px;
 font-weight:700;
}
.order{background:var(--copper);color:white}
.instagram{border:1px solid var(--espresso);color:var(--espresso)}
h2{font-size:1.05rem}
.item{
 background:var(--cream);
 padding:15px;border-radius:14px;margin-top:10px
}
.small{color:var(--muted);font-size:.8rem}
.footer{text-align:center;color:var(--muted);font-size:.75rem}
</style>
</head>
<body>
<div class="container">

<div class="card">
<div class="logo">س</div>
<h1>سمراء</h1>
<div class="brand">SAMRA COFFEE</div>
<p class="tag">Specialty Coffee • Saudi Arabia<br>محمصة وبن مختص بتحميص حرفي</p>
</div>

<div class="card">
<a class="btn order" href="https://wa.me/966599721275">الطلب عبر واتساب</a>
<a class="btn instagram" href="https://www.instagram.com/roastery.ksa/">إنستغرام</a>
</div>

<div class="card">
<h2>المحاصيل المختارة</h2>
<div class="item"><b>إثيوبيا - شيلبيسا</b><br><span class="small">ياسمين • خوخ • حلاوة عسلية</span></div>
<div class="item"><b>كولومبيا - سان أوغسطين</b><br><span class="small">كراميل • تفاح أحمر • شوكولاتة</span></div>
<div class="item"><b>البرازيل - سيرادو</b><br><span class="small">بندق • كاكاو • قوام غني</span></div>
</div>

<div class="footer">© 2026 SAMRA COFFEE ROASTERS</div>
</div>
</body>
</html>
